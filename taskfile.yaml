version: 3

tasks:
  # run the frontend development server
  frontend:
    desc: Run the frontend development server
    cmds:
      - cd frontend && npm run dev
  # run the backend development server
  backend:
    desc: Run the backend development server
    cmds:
      - cd backend && uv run uvicorn app.main:app --reload --port 8000
  # run both frontend and backend development servers concurrently
  run:
    desc: Run both frontend and backend development servers concurrently
    deps:
      - task: frontend
      - task: backend
  # build the docker compose stack and run the Playwright end-to-end tests
  e2e:
    desc: Run Playwright end-to-end tests against the docker-compose stack
    cmds:
      - cd e2e && npm ci
      - cd e2e && npx playwright install chromium
      - docker compose up --build -d
      - ./e2e/scripts/wait-for-app.sh
      - cd e2e && npm run e2e
    defer:
      - docker compose down -v
