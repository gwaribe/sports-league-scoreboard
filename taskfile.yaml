version: 3

tasks:
  # run the frontend development server
  frontend:
    desc: Run the frontend development server
    cmds:
      - cd frontend && npm run dev
  # run the backend development server
  backend:
    desc: Run the backend development server
    cmds:
      - cd backend && uv run uvicorn app.main:app --reload --port 8000
  # run both frontend and backend development servers concurrently
  run:
    desc: Run both frontend and backend development servers concurrently
    deps:
      - task: frontend
      - task: backend
  # run the Playwright end-to-end tests against an already-running deployment
  e2e:
    desc: >-
      Run Playwright e2e tests against a running deployment. Set
      PLAYWRIGHT_BASE_URL to the deployed URL (defaults to localhost:8000) and
      PLAYWRIGHT_CHANNEL=bundled to use Playwright's Chromium instead of the
      machine's installed Chrome.
    env:
      PLAYWRIGHT_BASE_URL: '{{.PLAYWRIGHT_BASE_URL | default "http://localhost:8000"}}'
    cmds:
      - cd e2e && npm ci
      - ./e2e/scripts/wait-for-app.sh
      - cd e2e && npm run e2e
