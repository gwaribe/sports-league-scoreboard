name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          Base URL of the deployed app. Defaults to the E2E_BASE_URL repository
          variable.
        required: false
        type: string
  # Runs after Render reports a successful deployment. This is preferred over a
  # `push` trigger, which can race Render's build and test the previous version.
  deployment_status:
  # If Render calls a deploy hook instead, have it POST a repository_dispatch
  # with type "render-deploy" and add:
  # repository_dispatch:
  #   types: [render-deploy]
  # Uncomment to test on every push to main (accepts the race described above):
  # push:
  #   branches: [main]

jobs:
  e2e:
    name: Playwright against the deployed app
    runs-on: ubuntu-latest
    # For `deployment_status`, only run once a deployment succeeded.
    if: >-
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    # ubuntu-latest ships Google Chrome; the suite uses it by default, so no
    # browser download and no application build are needed here.
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Require a deployment URL
        run: |
          if [ -z "${PLAYWRIGHT_BASE_URL}" ]; then
            echo "Set the E2E_BASE_URL repository variable or pass the base_url input." >&2
            exit 1
          fi

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci

      - name: Wait for the deployment
        run: ./e2e/scripts/wait-for-app.sh

      - name: Run Playwright tests
        working-directory: e2e
        run: npm run e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
