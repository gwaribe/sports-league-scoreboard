name: CI/CD

on:
  # Every push to main: test, then auto-deploy the development environment.
  push:
    branches: [main]
  # Pull requests: test only, never deploy.
  pull_request:
  # Manual run: choose the environment in the Actions UI. Deploying production
  # additionally waits for approval from the `production` GitHub Environment.
  workflow_dispatch:
    inputs:
      deploy:
        description: Environment to deploy after tests pass (run from main)
        required: true
        default: development
        type: choice
        options:
          - development
          - production

concurrency:
  # Include the event so a push to main cannot cancel an in-flight manual
  # production deploy (and vice versa).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # --- Test stage: backend and frontend run in parallel --------------------
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run pytest
        working-directory: backend
        run: uv run pytest -q

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run vitest
        working-directory: frontend
        run: npm test

  # --- Build the compose stack; run integration + e2e against it -----------
  compose-tests:
    name: Integration + e2e (docker compose)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      # Builds the frontend, the backend image and Postgres. `--wait` blocks
      # until the app and db healthchecks pass, so no manual sleep is needed.
      - name: Build and start the compose stack
        run: docker compose up --build -d --wait

      - name: Integration tests (API contract)
        working-directory: e2e
        run: npm run test:integration

      # Uses the Chrome that ships on ubuntu-latest, so no browser download.
      - name: End-to-end tests (browser)
        working-directory: e2e
        run: npm run test:e2e

      - name: Compose logs
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --- Deploy development: runs automatically on every push to main --------
  deploy-development:
    name: Deploy development
    runs-on: ubuntu-latest
    needs: [compose-tests]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == 'development')
    environment:
      name: development
    env:
      # Prefer the `development` environment's values; fall back to the old
      # repository-level settings so an existing setup keeps working.
      BASE_URL: ${{ vars.BASE_URL || vars.E2E_BASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment configuration
        run: |
          if [ -z "${BASE_URL}" ]; then
            echo "Set the BASE_URL variable in the 'development' GitHub Environment." >&2
            exit 1
          fi
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Set the RENDER_DEPLOY_HOOK_URL secret in the 'development' GitHub Environment." >&2
            exit 1
          fi
      - name: Deploy and validate via /api/health
        run: bash .github/scripts/deploy-render.sh

  # --- Deploy production: manual trigger, gated by required reviewers ------
  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [compose-tests]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy == 'production'
    # The `production` GitHub Environment must have required reviewers; this is
    # the manual approval gate that keeps production on the last good release.
    environment:
      name: production
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment configuration
        run: |
          if [ -z "${BASE_URL}" ]; then
            echo "Set the BASE_URL variable in the 'production' GitHub Environment." >&2
            exit 1
          fi
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Set the RENDER_DEPLOY_HOOK_URL secret in the 'production' GitHub Environment." >&2
            exit 1
          fi
      - name: Deploy and validate via /api/health
        run: bash .github/scripts/deploy-render.sh
