name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # --- Test stage: backend and frontend run in parallel --------------------
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run pytest
        working-directory: backend
        run: uv run pytest -q

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run vitest
        working-directory: frontend
        run: npm test

  # --- Build the compose stack; run integration + e2e against it -----------
  compose-tests:
    name: Integration + e2e (docker compose)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      # Builds the frontend, the backend image and Postgres. `--wait` blocks
      # until the app and db healthchecks pass, so no manual sleep is needed.
      - name: Build and start the compose stack
        run: docker compose up --build -d --wait

      - name: Integration tests (API contract)
        working-directory: e2e
        run: npm run test:integration

      # Uses the Chrome that ships on ubuntu-latest, so no browser download.
      - name: End-to-end tests (browser)
        working-directory: e2e
        run: npm run test:e2e

      - name: Compose logs
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --- Deploy stage: Render, then validate /api/health reports the commit --
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: compose-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      # Prefer a repository Variable; fall back to a Secret with the same name
      # so a URL stored either way works.
      BASE_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Require deployment configuration
        run: |
          if [ -z "${BASE_URL}" ]; then
            echo "Set the E2E_BASE_URL repository variable to the Render URL." >&2
            exit 1
          fi
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Set the RENDER_DEPLOY_HOOK_URL secret." >&2
            exit 1
          fi

      - name: Trigger Render deploy
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"

      # Render exposes RENDER_GIT_COMMIT at runtime; /api/health returns it.
      # Waiting for it to equal this run's SHA proves the new build is live.
      - name: Validate the deployment via /api/health
        run: |
          base="${BASE_URL%/}"
          target="${GITHUB_SHA}"
          deadline=$((SECONDS + 900))
          echo "Waiting for ${base}/api/health to report commit ${target}…"
          while :; do
            body="$(curl -fsS "${base}/api/health" 2>/dev/null || true)"
            commit="$(printf '%s' "${body}" | jq -r '.commit // empty' 2>/dev/null || true)"
            echo "health: ${body:-<no response>}"
            if [ "${commit}" = "${target}" ]; then
              echo "Deployment validated: ${commit} is live."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out after 15m waiting for commit ${target}." >&2
              exit 1
            fi
            sleep 15
          done
