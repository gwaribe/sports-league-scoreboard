[project]
name = "sports-league-scoreboard-backend"
version = "0.1.0"
description = "FastAPI backend for the Sports League Scoreboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

# This is an application, not a distributable library: nothing to build/install.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
